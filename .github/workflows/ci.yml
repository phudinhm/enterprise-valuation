name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run already in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 requires Node 20.9+; 22 is the current LTS.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Verify the analytics engines
        run: npm run verify

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Kept as its own job so a newly published advisory reports as an audit
      # failure rather than making the build look broken. It fails the check on
      # purpose: a stale vulnerable dependency reached a deploy once already.
      - name: Audit
        run: npm audit --audit-level=high
